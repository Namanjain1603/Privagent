<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privagent Demo Website</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="email"], input[type="password"], select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
    }
    .spacer {
      height: 1500px;
      background: linear-gradient(#eee, #ccc);
      margin: 20px 0;
      padding: 20px;
      text-align: center;
    }
    #result-box {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      background: #e9ecef;
    }
  </style>
</head>
<body>

  <h1>Privagent Demo Form</h1>
  <p>This is a local demo page to test the capabilities of the Privagent M3 Chrome Extension MVP.</p>

  <form id="demo-form" onsubmit="event.preventDefault(); showResult('Form Submitted!');">
    
    <div class="form-group">
      <label for="name_input">Full Name</label>
      <input type="text" id="name_input" name="fullName" placeholder="Enter your full name" />
    </div>

    <div class="form-group">
      <label for="email_input">Email Address</label>
      <input type="email" id="email_input" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label for="phone_input">Phone Number (PII)</label>
      <input type="text" id="phone_input" placeholder="Enter your phone number" />
    </div>

    <div class="form-group">
      <label for="aadhaar_input">Aadhaar / PAN (Sensitive)</label>
      <input type="text" id="aadhaar_input" placeholder="Enter sensitive ID" />
    </div>

    <div class="form-group">
      <label for="password_input">Password</label>
      <input type="password" id="password_input" placeholder="Enter your password" />
    </div>

    <div class="form-group">
      <label for="otp_input">OTP</label>
      <input type="password" id="otp_input" placeholder="Enter OTP" />
    </div>

    <div class="form-group">
      <label for="state_select">State</label>
      <select id="state_select">
        <option value="">Select a state</option>
        <option value="Rajasthan">Rajasthan</option>
        <option value="Delhi">Delhi</option>
        <option value="Punjab">Punjab</option>
      </select>
    </div>

    <div class="form-group">
      <button type="submit" id="submit_button">Submit Form</button>
      <button type="button" id="disabled_button" disabled>Disabled Button</button>
    </div>

  </form>

  <div id="result-box">Waiting for interaction...</div>

  <div class="spacer">
    Scroll Down to see more content.
  </div>

  <h2>Bottom Section</h2>
  <a href="https://example.com" id="example_link" target="_blank">External Link (example.com)</a>

  <script>
    function showResult(message) {
      document.getElementById('result-box').innerText = message;
      console.log(message);
    }

    // Attach event listeners to show that types/selects are working
    ['name_input', 'email_input', 'phone_input', 'aadhaar_input', 'password_input', 'otp_input'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
         const isSensitive = e.target.type === 'password';
         showResult(`Typed in ${id}: ${isSensitive ? '***' : e.target.value}`);
      });
    });

    document.getElementById('state_select').addEventListener('change', (e) => {
      showResult(`Selected state: ${e.target.value}`);
    });
  </script>
</body>
</html>
